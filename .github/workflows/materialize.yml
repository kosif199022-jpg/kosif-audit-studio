name: Materialize verified KOSIF source

# Retry after verifying all ten bundle segments by Git blob SHA.
on:
  push:
    paths:
      - '.github/workflows/materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kosif-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/kosif-audit-studio.tar.gz.b64
          base64 --decode /tmp/kosif-audit-studio.tar.gz.b64 > /tmp/kosif-audit-studio.tar.gz
          echo "76f043cf8d92db5e0453c4a6afe73de472ddd30d7e4000668d7d4091d674fd75  /tmp/kosif-audit-studio.tar.gz" | sha256sum --check -
          tar -xzf /tmp/kosif-audit-studio.tar.gz -C .
          rm -rf .bootstrap

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deterministic engine and source syntax
        run: npm test && npm run check && node --check sw.js

      - name: Commit materialized application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat: materialize verified KOSIF Audit Studio source"
            git push origin HEAD:main
          else
            echo "Source is already materialized."
          fi
