name: Repair Aghnam Alwadi Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-aghnam.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Aghnam source
        uses: actions/checkout@v4
        with:
          repository: kosif199022-jpg/cloude
          ref: main

      - name: Build password-locked full-data mobile v28 release
        run: |
          python3 build.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path("dist/index.html")
          b=p.read_bytes()
          print("index bytes:", len(b))
          head=b.lstrip()[:20].lower()
          assert head.startswith(b"<!doctype html") or head.startswith(b"<html"), head
          print("Locked HTML validation: OK")
          app=Path("dist/app-safe.html").read_text(encoding="utf-8")
          assert "mobile-v28.css?v=28" in app
          assert "mobile-v28.js?v=28" in app
          assert Path("dist/mobile-v28.css").exists()
          assert Path("dist/mobile-v28.js").exists()
          print("Mobile v28 validation: OK")
          assert Path("dist/secure/crypto.json").exists()
          assert len(list(Path("dist/secure").glob("seed.enc.b64.part*"))) == 6
          print("Encrypted dataset validation: OK")
          PY

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 9ff3d8494afab356ecbf95a2a231a6b5
          wranglerVersion: "4"
          command: pages deploy dist --project-name=aghnam-alwadi-iphone --branch=main
