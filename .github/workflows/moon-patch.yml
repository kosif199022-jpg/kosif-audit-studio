name: Apply Moon integration patch

on:
  push:
    branches:
      - feat/moon-command-center-phase-1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/moon-command-center-phase-1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch static entry and service worker
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          marker = '  <script type="module" src="./app.js"></script>'
          moon = '  <script type="module" src="./moon-layer.js"></script>'
          if moon not in text:
              if marker not in text:
                  raise SystemExit('index.html app.js marker not found')
              text = text.replace(marker, marker + '\n' + moon, 1)
              index.write_text(text)

          sw = Path('sw.js')
          text = sw.read_text()
          text = text.replace("const CACHE = 'kosif-audit-studio-v1';", "const CACHE = 'kosif-audit-studio-v2';", 1)
          marker = "  './app.js',"
          additions = "  './moon-core.js',\n  './moon-layer.js',\n  './moon-layer.css',"
          if "'./moon-layer.js'" not in text:
              if marker not in text:
                  raise SystemExit('sw.js app.js cache marker not found')
              text = text.replace(marker, marker + '\n' + additions, 1)
          sw.write_text(text)
          PY
      - name: Run tests
        run: npm test
      - name: Commit integration patch and remove helper workflow
        run: |
          rm .github/workflows/moon-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js .github/workflows/moon-patch.yml
          git commit -m "feat(moon): wire command center into PWA"
          git push
