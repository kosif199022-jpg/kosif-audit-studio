name: Apply Moon integration patch

on:
  push:
    branches:
      - feat/moon-command-center-phase-1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/moon-command-center-phase-1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire Moon into the static entry
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          text = index.read_text()
          marker = '  <script type="module" src="./app.js"></script>'
          moon = '  <script type="module" src="./moon-layer.js"></script>'
          if moon not in text:
              if marker not in text:
                  raise SystemExit('index.html app.js marker not found')
              index.write_text(text.replace(marker, marker + '\n' + moon, 1))
          PY
      - name: Run deterministic and Moon tests
        run: npm test
      - name: Commit integration patch and remove helper workflow
        run: |
          rm .github/workflows/moon-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/moon-patch.yml
          git commit -m "feat(moon): wire command center into PWA"
          git push
