name: Deploy WhatsApp Container v2

on:
  push:
    branches: [main]
    paths:
      - "whatsapp-container-v2/**"
      - ".github/workflows/wa-container-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wa-container-v2
  cancel-in-progress: true

jobs:
  build-and-rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and push container image
        working-directory: whatsapp-container-v2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9ff3d8494afab356ecbf95a2a231a6b5
        run: |
          npx --yes wrangler@latest containers build --push -t wa-kosif-wabridge:v2 .

      - name: Roll out v2 image
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/9ff3d8494afab356ecbf95a2a231a6b5/containers/applications/a0386aaa-65a0-4200-86e8-988ea6ed2b70/rollouts" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{
              "description":"KOSIF WhatsApp media support v2",
              "strategy":"rolling",
              "kind":"full_auto",
              "step_percentage":100,
              "target_configuration":{
                "image":"registry.cloudflare.com/9ff3d8494afab356ecbf95a2a231a6b5/wa-kosif-wabridge:v2",
                "instance_type":"basic",
                "observability":{"logs":{"enabled":true}}
              }
            }'
